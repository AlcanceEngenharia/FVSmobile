<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<title>FVS — Manaii</title>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
<style>
:root {
  --bg: #0A0B0D;
  --s1: #111216;
  --s2: #18191F;
  --s3: #1E2028;
  --bd: rgba(255,255,255,0.07);
  --bd2: rgba(255,255,255,0.13);
  --tx: #F0F1F5;
  --mu: #6B6F80;
  --mu2: #9095A8;
  --ac: #F0A500;
  --ok: #22C55E; --okb: rgba(34,197,94,0.13);
  --nc: #EF4444; --ncb: rgba(239,68,68,0.13);
  --na: #6B7280; --nab: rgba(107,114,128,0.10);
  --pe: #F0A500; --peb: rgba(240,165,0,0.13);
  --c1:#60A5FA; --c1b:rgba(96,165,250,0.13);
  --c2:#34D399; --c2b:rgba(52,211,153,0.13);
  --c3:#A78BFA; --c3b:rgba(167,139,250,0.13);
  --c4:#FBBF24; --c4b:rgba(251,191,36,0.13);
  --c5:#38BDF8; --c5b:rgba(56,189,248,0.13);
  --c6:#F472B6; --c6b:rgba(244,114,182,0.13);
  --c7:#FB923C; --c7b:rgba(251,146,60,0.13);
  --fn: 'Inter', system-ui, sans-serif;
  --fm: 'JetBrains Mono', monospace;
  --nav-h: 60px;
  --top-h: 52px;
}

*, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
html, body { height: 100%; overflow: hidden; }

body {
  font-family: var(--fn);
  background: var(--bg);
  color: var(--tx);
  font-size: 14px;
  display: flex;
  flex-direction: column;
}

/* ── TOPBAR ── */
.topbar {
  height: var(--top-h);
  background: var(--s1);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  padding: 0 16px;
  gap: 10px;
  flex-shrink: 0;
  position: relative;
  z-index: 10;
}

.topbar-logo {
  display: flex;
  flex-direction: column;
  flex: 1;
  min-width: 0;
}

.topbar-obra {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--ac);
  line-height: 1;
}

.topbar-page {
  font-size: 14px;
  font-weight: 600;
  color: var(--tx);
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.topbar-chips {
  display: flex;
  gap: 5px;
  flex-shrink: 0;
}

.chip {
  font-size: 10px;
  font-weight: 600;
  font-family: var(--fm);
  padding: 3px 7px;
  border-radius: 20px;
}

.chip-ok   { background: var(--okb); color: var(--ok); }
.chip-nc   { background: var(--ncb); color: var(--nc); }
.chip-pe   { background: var(--peb); color: var(--pe); }

/* ── SCROLL AREA ── */
.scroll-area {
  flex: 1;
  overflow-y: auto;
  overflow-x: hidden;
  -webkit-overflow-scrolling: touch;
  padding-bottom: calc(var(--nav-h) + 8px);
}

/* ── BOTTOM NAV ── */
.bottom-nav {
  height: var(--nav-h);
  background: var(--s1);
  border-top: 1px solid var(--bd);
  display: flex;
  align-items: stretch;
  flex-shrink: 0;
  padding-bottom: env(safe-area-inset-bottom);
  position: relative;
  z-index: 10;
}

.bnav-item {
  flex: 1;
  display: flex;
  flex-direction: column;
  align-items: center;
  justify-content: center;
  gap: 3px;
  cursor: pointer;
  color: var(--mu);
  transition: color 0.15s;
  font-size: 10px;
  font-weight: 500;
  position: relative;
  border: none;
  background: none;
  padding: 0;
}

.bnav-item.active { color: var(--ac); }
.bnav-item.active::after {
  content: '';
  position: absolute;
  top: 0; left: 20%; right: 20%;
  height: 2px;
  background: var(--ac);
  border-radius: 0 0 2px 2px;
}

.bnav-icon {
  width: 22px; height: 22px;
  display: flex; align-items: center; justify-content: center;
}

.bnav-icon svg { width: 20px; height: 20px; }

.bnav-dot {
  width: 7px; height: 7px;
  border-radius: 50%;
  margin-bottom: 2px;
}

/* ── FVS DRAWER ── */
.fvs-drawer {
  display: none;
  position: fixed;
  inset: var(--top-h) 0 var(--nav-h) 0;
  background: var(--bg);
  z-index: 20;
  flex-direction: column;
  overflow: hidden;
}

.fvs-drawer.open { display: flex; }

.drawer-header {
  padding: 14px 16px 12px;
  background: var(--s1);
  border-bottom: 1px solid var(--bd);
  display: flex;
  align-items: center;
  gap: 10px;
}

.drawer-close {
  width: 32px; height: 32px;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: transparent;
  cursor: pointer;
  display: flex; align-items: center; justify-content: center;
  color: var(--mu2);
  flex-shrink: 0;
}

.drawer-list {
  flex: 1;
  overflow-y: auto;
  -webkit-overflow-scrolling: touch;
}

.drawer-item {
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 14px 16px;
  border-bottom: 1px solid var(--bd);
  cursor: pointer;
  transition: background 0.1s;
}

.drawer-item:active { background: var(--s3); }

.drawer-dot { width: 8px; height: 8px; border-radius: 50%; flex-shrink: 0; }

.drawer-item-info { flex: 1; min-width: 0; }

.drawer-item-num {
  font-size: 10px;
  font-weight: 700;
  font-family: var(--fm);
  color: var(--mu);
  margin-bottom: 1px;
}

.drawer-item-name {
  font-size: 14px;
  font-weight: 500;
  color: var(--tx);
}

.drawer-badge {
  font-size: 11px;
  font-weight: 600;
  font-family: var(--fm);
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}

.db-pend { background: var(--peb); color: var(--pe); }
.db-ok   { background: var(--okb); color: var(--ok); }
.db-nc   { background: var(--ncb); color: var(--nc); }

/* ── PAGES ── */
.page { display: none; padding: 0; }
.page.active { display: block; }

/* ── DASHBOARD ── */
.dash-hero {
  padding: 20px 16px 16px;
  background: var(--s1);
  border-bottom: 1px solid var(--bd);
}

.dash-title {
  font-size: 18px;
  font-weight: 600;
  margin-bottom: 2px;
}

.dash-sub {
  font-size: 12px;
  color: var(--mu);
}

.stats-row {
  display: grid;
  grid-template-columns: repeat(3, 1fr);
  gap: 1px;
  background: var(--bd);
  border-top: 1px solid var(--bd);
  border-bottom: 1px solid var(--bd);
}

.stat-cell {
  background: var(--s2);
  padding: 14px 10px;
  text-align: center;
}

.stat-val {
  font-size: 22px;
  font-weight: 600;
  font-family: var(--fm);
  line-height: 1;
}

.stat-lbl {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.08em;
  color: var(--mu);
  margin-top: 3px;
}

.fvs-list { padding: 12px 16px; display: flex; flex-direction: column; gap: 10px; }

.fvs-card {
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: 12px;
  padding: 14px 14px 12px;
  cursor: pointer;
  transition: background 0.12s;
  position: relative;
  overflow: hidden;
}

.fvs-card:active { background: var(--s3); }

.fvs-card-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 10px;
}

.fvs-badge-num {
  font-size: 10px;
  font-weight: 700;
  font-family: var(--fm);
  padding: 3px 8px;
  border-radius: 4px;
  flex-shrink: 0;
  margin-top: 1px;
}

.fvs-card-titles { flex: 1; min-width: 0; }

.fvs-card-title {
  font-size: 14px;
  font-weight: 600;
  line-height: 1.3;
}

.fvs-card-sub {
  font-size: 11px;
  color: var(--mu);
  margin-top: 2px;
}

.fvs-card-status {
  font-size: 10px;
  font-weight: 600;
  font-family: var(--fm);
  padding: 2px 8px;
  border-radius: 10px;
  flex-shrink: 0;
}

.fvs-prog-row {
  display: flex;
  align-items: center;
  gap: 8px;
}

.prog-bar {
  flex: 1;
  height: 3px;
  background: var(--s1);
  border-radius: 2px;
  overflow: hidden;
}

.prog-fill {
  height: 100%;
  border-radius: 2px;
  transition: width 0.3s;
}

.prog-pct {
  font-size: 10px;
  font-family: var(--fm);
  color: var(--mu);
  min-width: 30px;
  text-align: right;
}

.fvs-mini-stats {
  display: flex;
  gap: 6px;
  margin-top: 8px;
}

.mini-s {
  font-size: 10px;
  font-family: var(--fm);
  padding: 2px 7px;
  border-radius: 4px;
}

/* ── FVS PANEL ── */
.panel-head {
  padding: 16px;
  background: var(--s1);
  border-bottom: 1px solid var(--bd);
  display: flex;
  gap: 12px;
  align-items: flex-start;
}

.panel-icon-m {
  width: 40px; height: 40px;
  border-radius: 10px;
  display: flex; align-items: center; justify-content: center;
  font-size: 10px; font-weight: 700; font-family: var(--fm);
  flex-shrink: 0;
}

.panel-head-text { flex: 1; min-width: 0; }

.panel-title-m {
  font-size: 15px;
  font-weight: 600;
  line-height: 1.3;
}

.panel-sub-m {
  font-size: 11px;
  color: var(--mu);
  margin-top: 2px;
}

.panel-status-wrap {
  display: flex;
  align-items: flex-start;
  flex-shrink: 0;
}

/* ── FIELDS ── */
.fields-section {
  padding: 12px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--bd);
}

.fields-section-title {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mu);
}

.field-row {
  display: flex;
  flex-direction: column;
  gap: 4px;
}

.field-lbl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  color: var(--mu);
}

.field-inp {
  background: var(--s3);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 14px;
  color: var(--tx);
  font-family: var(--fn);
  outline: none;
  width: 100%;
  transition: border-color 0.15s;
  -webkit-appearance: none;
}

.field-inp:focus { border-color: var(--ac); }
.field-inp::placeholder { color: var(--mu); }
.field-inp[type="date"] { color-scheme: dark; }

/* ── CHECKLIST ── */
.checklist-section {
  border-bottom: 1px solid var(--bd);
}

.cl-header {
  padding: 8px 16px;
  background: var(--s3);
  border-bottom: 1px solid var(--bd);
  font-size: 9px;
  font-weight: 600;
  letter-spacing: 0.12em;
  text-transform: uppercase;
  color: var(--mu);
  display: flex;
  justify-content: space-between;
  align-items: center;
}

.cl-header-actions { display: flex; gap: 16px; }

.cl-group-title {
  padding: 8px 16px;
  background: var(--s3);
  border-bottom: 1px solid var(--bd);
  font-size: 11px;
  font-weight: 600;
  letter-spacing: 0.08em;
  text-transform: uppercase;
  display: flex;
  align-items: center;
  gap: 8px;
}

.cl-item {
  padding: 12px 16px;
  border-bottom: 1px solid var(--bd);
  transition: background 0.1s;
}

.cl-item.is-conf { background: rgba(34,197,94,0.04); }
.cl-item.is-nc   { background: rgba(239,68,68,0.04); }
.cl-item.is-na   { background: rgba(107,114,128,0.04); }

.cl-item-top {
  display: flex;
  align-items: flex-start;
  gap: 10px;
  margin-bottom: 8px;
}

.cl-item-num {
  font-size: 11px;
  font-family: var(--fm);
  color: var(--mu);
  min-width: 20px;
  margin-top: 1px;
  flex-shrink: 0;
}

.cl-item-text {
  font-size: 13px;
  line-height: 1.5;
  color: var(--tx);
  flex: 1;
}

.cl-item-ref {
  display: inline-block;
  font-size: 10px;
  font-family: var(--fm);
  color: var(--mu);
  background: var(--s1);
  border: 1px solid var(--bd);
  border-radius: 3px;
  padding: 1px 6px;
  margin-top: 4px;
  margin-left: 30px;
}

/* Touch-friendly 3-button row */
.cl-btns {
  display: grid;
  grid-template-columns: 1fr 1fr 1fr;
  gap: 6px;
  margin-top: 0;
}

.cl-btn {
  padding: 10px 0;
  border-radius: 8px;
  border: 1px solid var(--bd);
  background: var(--s3);
  cursor: pointer;
  font-size: 12px;
  font-weight: 600;
  color: var(--mu);
  transition: all 0.12s;
  text-align: center;
  display: flex;
  align-items: center;
  justify-content: center;
  gap: 5px;
  -webkit-tap-highlight-color: transparent;
  user-select: none;
}

.cl-btn:active { transform: scale(0.96); }
.cl-btn.active-conf { background: var(--okb); border-color: var(--ok); color: var(--ok); }
.cl-btn.active-nc   { background: var(--ncb); border-color: var(--nc); color: var(--nc); }
.cl-btn.active-na   { background: var(--nab); border-color: var(--na); color: var(--na); }

/* ── RESULT STRIP ── */
.result-strip {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  border-top: 2px solid var(--bd);
  border-bottom: 1px solid var(--bd);
  background: var(--s2);
}

.rs-cell {
  text-align: center;
  padding: 12px 4px;
  border-right: 1px solid var(--bd);
}

.rs-cell:last-child { border-right: none; }

.rs-num {
  font-size: 20px;
  font-weight: 600;
  font-family: var(--fm);
  line-height: 1;
}

.rs-lbl {
  font-size: 9px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.06em;
  color: var(--mu);
  margin-top: 3px;
}

/* ── STATUS BADGE ── */
.st-badge {
  font-size: 10px;
  font-weight: 600;
  font-family: var(--fm);
  padding: 4px 10px;
  border-radius: 6px;
  border: 1px solid;
  text-transform: uppercase;
  letter-spacing: 0.04em;
}

.st-a { background: var(--okb); color: var(--ok); border-color: var(--ok); }
.st-r { background: var(--ncb); color: var(--nc); border-color: var(--nc); }
.st-p { background: var(--peb); color: var(--pe); border-color: var(--pe); }

/* ── STATUS BAR ── */
.status-bar {
  display: flex;
  align-items: center;
  justify-content: space-between;
  padding: 10px 16px;
  background: var(--s2);
  border-bottom: 1px solid var(--bd);
}

.status-bar-lbl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mu);
}

/* ── OBS ── */
.obs-section {
  padding: 14px 16px;
  border-bottom: 1px solid var(--bd);
}

.obs-lbl {
  font-size: 10px;
  font-weight: 600;
  letter-spacing: 0.1em;
  text-transform: uppercase;
  color: var(--mu);
  margin-bottom: 8px;
}

.obs-inp {
  width: 100%;
  background: var(--s3);
  border: 1px solid var(--bd);
  border-radius: 8px;
  padding: 10px 12px;
  font-size: 13px;
  color: var(--tx);
  font-family: var(--fn);
  resize: none;
  outline: none;
  min-height: 72px;
  line-height: 1.5;
  -webkit-appearance: none;
}

.obs-inp::placeholder { color: var(--mu); }
.obs-inp:focus { border-color: var(--ac); }

/* ── ASSINATURAS ── */
.assin-section {
  padding: 14px 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
  border-bottom: 1px solid var(--bd);
}

.assin-box-m {
  background: var(--s2);
  border: 1px solid var(--bd);
  border-radius: 10px;
  padding: 12px 14px;
}

.assin-lbl-m {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--mu);
  margin-bottom: 20px;
}

.assin-line-m {
  border-bottom: 1px solid var(--bd2);
  margin-bottom: 5px;
}

.assin-sub-m {
  font-size: 11px;
  color: var(--mu);
}

/* ── PDF SECTION ── */
.pdf-section {
  padding: 16px;
  display: flex;
  flex-direction: column;
  gap: 10px;
}

.pdf-section-title {
  font-size: 10px;
  font-weight: 600;
  text-transform: uppercase;
  letter-spacing: 0.1em;
  color: var(--mu);
}

.pdf-btn {
  display: flex;
  align-items: center;
  gap: 10px;
  padding: 14px 16px;
  border-radius: 10px;
  border: 1px solid var(--bd);
  background: var(--s2);
  cursor: pointer;
  transition: background 0.12s;
  width: 100%;
  text-align: left;
  color: var(--tx);
}

.pdf-btn:active { background: var(--s3); }

.pdf-btn.primary {
  background: var(--ac);
  border-color: var(--ac);
  color: #000;
}

.pdf-btn.primary:active { background: #FFB800; }

.pdf-btn-icon {
  width: 36px; height: 36px;
  border-radius: 8px;
  background: var(--s3);
  display: flex; align-items: center; justify-content: center;
  flex-shrink: 0;
}

.pdf-btn.primary .pdf-btn-icon { background: rgba(0,0,0,0.15); }

.pdf-btn-info { flex: 1; min-width: 0; }
.pdf-btn-name { font-size: 14px; font-weight: 600; }
.pdf-btn-sub { font-size: 11px; color: var(--mu2); margin-top: 1px; }
.pdf-btn.primary .pdf-btn-sub { color: rgba(0,0,0,0.5); }

/* ── PRINT ── */
@media print {
  @page { size: A4 portrait; margin: 10mm 8mm; }
  * { -webkit-print-color-adjust: exact !important; print-color-adjust: exact !important; }
  html, body { visibility: hidden !important; background: white !important; }
  #print-container, #print-container * { visibility: visible !important; }
  #print-container { display: block !important; position: fixed !important; top: 0 !important; left: 0 !important; width: 100% !important; background: white !important; z-index: 999999 !important; }
}
#print-container { display: none; }
</style>
</head>
<body>

<!-- TOPBAR -->
<div class="topbar">
  <div class="topbar-logo">
    <div class="topbar-obra">Residencial Manaii</div>
    <div class="topbar-page" id="topbar-page">Dashboard</div>
  </div>
  <div class="topbar-chips">
    <span class="chip chip-ok" id="chip-ok">✓ 0</span>
    <span class="chip chip-nc" id="chip-nc">✗ 0</span>
    <span class="chip chip-pe" id="chip-pe">◎ 69</span>
  </div>
</div>

<!-- SCROLL AREA -->
<div class="scroll-area" id="scroll-area">

  <!-- DASHBOARD PAGE -->
  <div class="page active" id="page-dashboard">
    <div class="dash-hero">
      <div class="dash-title">Painel de Vistoria</div>
      <div class="dash-sub">7 fichas · 69 itens · Fase de acabamentos</div>
    </div>
    <div class="stats-row">
      <div class="stat-cell"><div class="stat-val" style="color:var(--ok)" id="ds-conf">0</div><div class="stat-lbl">Conf.</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:var(--nc)" id="ds-nc">0</div><div class="stat-lbl">N.Conf.</div></div>
      <div class="stat-cell"><div class="stat-val" style="color:var(--pe)" id="ds-pend">69</div><div class="stat-lbl">Pend.</div></div>
    </div>
    <div class="fvs-list" id="fvs-card-list"></div>
  </div>

  <!-- FVS PANELS (built by JS) -->
  <div id="fvs-panels"></div>

  <!-- PDF PAGE -->
  <div class="page" id="page-pdf">
    <div class="dash-hero">
      <div class="dash-title">Exportar PDF</div>
      <div class="dash-sub">Gere o relatório de cada ficha individualmente</div>
    </div>
    <div class="pdf-section">
      <div class="pdf-section-title">Fichas individuais</div>
      <div id="pdf-btns-list"></div>
      <div style="margin-top:4px">
        <button class="pdf-btn primary" onclick="gerarPDF('todas')">
          <div class="pdf-btn-icon">

  forro_gesso:'FVS-03 · Entrada Forro'
};

function countItems(fvs) {
  return fvs.groups.reduce((a,g) => a + g.items.length, 0);
}

function getStats(id) {
  const fvs = FVS_DATA.find(f => f.id === id);
  const total = countItems(fvs);
  let conf=0, nc=0, na=0;
  for(let i=0; i<total; i++) {
    const s = state[id][i];
    if(s==='conf') conf++;
    else if(s==='nc') nc++;
    else if(s==='na') na++;
  }
  return { total, conf, nc, na, pend: total-conf-nc-na };
}

        <input class="field-inp" type="${f.t}" placeholder="${f.p}" data-fvs="${fvs.id}">
      </div>`
    ).join('');

    // Groups
    let clHTML = '';
    fvs.groups.forEach(grp => {
      clHTML += `<div class="cl-group-title">
        <span style="display:inline-block;width:3px;height:11px;border-radius:2px;background:${color};flex-shrink:0"></span>
        ${grp.g}
      </div>`;
      grp.items.forEach(item => {
        const i = itemIdx++;
        clHTML += `<div class="cl-item" id="citem-${fvs.id}-${i}">
          <div class="cl-item-top">
            <span class="cl-item-num">${i+1}</span>
            <span class="cl-item-text">${item.t}</span>
          </div>
          <div class="cl-item-ref">${item.r}</div>
          <div class="cl-btns" style="margin-top:8px">
            <button class="cl-btn" id="cb-conf-${fvs.id}-${i}" onclick="setItem('${fvs.id}',${i},'conf')">✓ Conf.</button>
            <button class="cl-btn" id="cb-nc-${fvs.id}-${i}" onclick="setItem('${fvs.id}',${i},'nc')">✗ N.Conf.</button>
            <button class="cl-btn" id="cb-na-${fvs.id}-${i}" onclick="setItem('${fvs.id}',${i},'na')">N/A</button>
          </div>
        </div>`;
      });
    });

    const panel = document.createElement('div');
    panel.className = 'page';
    panel.id = 'panel-' + fvs.id;
    panel.innerHTML = `
      <div class="panel-head">
        <div class="panel-icon-m" style="background:${fvs.colorbg};color:${color}">${fvs.num}</div>
        <div class="panel-head-text">
          <div class="panel-title-m">${fvs.title}</div>
          <div class="panel-sub-m">${fvs.sub}</div>
        </div>
        <div class="panel-status-wrap">
          <span class="st-badge st-p" id="pstatus-${fvs.id}">Pend.</span>
        </div>
      </div>
      <div class="fields-section">
        <div class="fields-section-title">Identificação</div>
        ${fieldsHTML}
      </div>
      <div class="checklist-section">
        <div class="cl-header">
          <span>Itens de Verificação</span>
          <span style="color:var(--tx);font-size:10px" id="cl-progress-${fvs.id}">0 / ${total}</span>
        </div>
        ${clHTML}
      </div>
      <div class="result-strip" id="rstrip-${fvs.id}">
        <div class="rs-cell"><div class="rs-num" style="color:var(--ok)">0</div><div class="rs-lbl">Conf.</div></div>
        <div class="rs-cell"><div class="rs-num" style="color:var(--nc)">0</div><div class="rs-lbl">N.Conf.</div></div>
        <div class="rs-cell"><div class="rs-num" style="color:var(--mu)">0</div><div class="rs-lbl">N/A</div></div>
        <div class="rs-cell"><div class="rs-num" style="color:var(--pe)">${total}</div><div class="rs-lbl">Pend.</div></div>
        <div class="rs-cell"><div class="rs-num" style="color:var(--tx)">${total}</div><div class="rs-lbl">Total</div></div>
      </div>
      <div class="status-bar">
        <span class="status-bar-lbl">Resultado</span>
        <span class="st-badge st-p" id="status-${fvs.id}">Pendente</span>
      </div>
      <div class="obs-section">
        <div class="obs-lbl">Observações / NCs</div>
        <textarea class="obs-inp" placeholder="Descreva as não conformidades encontradas..." data-fvs="${fvs.id}"></textarea>
      </div>
      <div class="assin-section">
        <div class="assin-box-m"><div class="assin-lbl-m">Estagiária</div><div class="assin-line-m"></div><div class="assin-sub-m">Nome / Data</div></div>
        <div class="assin-box-m"><div class="assin-lbl-m">Mestre de Obras</div><div class="assin-line-m"></div><div class="assin-sub-m">Nome / Data</div></div>
        <div class="assin-box-m"><div class="assin-lbl-m">Eng. Responsável</div><div class="assin-line-m"></div><div class="assin-sub-m">Nome / Data / CREA</div></div>
      </div>`;
    wrap.appendChild(panel);
  });
}

// ── Navigation ─────────────────────────────────────────────────
function showPage(id) {
  document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
  document.querySelectorAll('.bnav-item').forEach(b => b.classList.remove('active'));

  document.getElementById('topbar-page').textContent = PAGE_LABELS[id] || id;

  if(id === 'dashboard') {
    document.getElementById('page-dashboard').classList.add('active');
    document.getElementById('bnav-dashboard').classList.add('active');
    currentFvs = null;
  } else if(id === 'pdf') {
    document.getElementById('page-pdf').classList.add('active');
    document.getElementById('bnav-pdf').classList.add('active');
    currentFvs = null;
  } else {
    document.getElementById('panel-' + id).classList.add('active');
    document.getElementById('bnav-fvs').classList.add('active');
    currentFvs = id;
  }

  document.getElementById('scroll-area').scrollTop = 0;
}

function toggleFvsDrawer() {
  drawerOpen = !drawerOpen;
  const drawer = document.getElementById('fvs-drawer');
  drawer.classList.toggle('open', drawerOpen);
  if(drawerOpen) document.getElementById('bnav-fvs').classList.add('active');
  else if(currentFvs === null) document.getElementById('bnav-fvs').classList.remove('active');
}

// ── Check item ─────────────────────────────────────────────────
function setItem(fvsId, idx, status) {
  state[fvsId][idx] = status;
  ['conf','nc','na'].forEach(s => {
    const b = document.getElementById(`cb-${s}-${fvsId}-${idx}`);
    if(b) b.className = 'cl-btn' + (status === s ? ` active-${s}` : '');
  });
  const row = document.getElementById(`citem-${fvsId}-${idx}`);
  if(row) row.className = 'cl-item' + (status === 'conf' ? ' is-conf' : status === 'nc' ? ' is-nc' : status === 'na' ? ' is-na' : '');
  updateStats(fvsId);
  updateGlobal();
}

function updateStats(id) {
  const { total, conf, nc, na, pend } = getStats(id);
  const done = conf + nc + na;
  const pct = Math.round((done / total) * 100);

  // Result strip
  const rs = document.getElementById('rstrip-' + id);
  if(rs) {
    const nums = rs.querySelectorAll('.rs-num');
    if(nums[0]) nums[0].textContent = conf;
    if(nums[1]) nums[1].textContent = nc;
    if(nums[2]) nums[2].textContent = na;
    if(nums[3]) nums[3].textContent = pend;
  }

  // Progress in header
  const cp = document.getElementById('cl-progress-' + id);
  if(cp) cp.textContent = done + ' / ' + total;

  // Status badges
  const stClass = pend > 0 ? 'st-p' : nc > 0 ? 'st-r' : 'st-a';
  const stTxt = pend > 0 ? 'Pendente' : nc > 0 ? '✗ Reprovado' : '✓ Aprovado';
  const stTxtS = pend > 0 ? 'Pend.' : nc > 0 ? 'Reprov.' : 'Aprov.';

  ['pstatus-','status-'].forEach((pfx, i) => {
    const el = document.getElementById(pfx + id);
    if(el) { el.className = 'st-badge ' + stClass; el.textContent = i === 0 ? stTxtS : stTxt; }
  });

  // Card
  const cs = document.getElementById('cstatus-' + id);
  if(cs) { cs.className = 'fvs-card-status ' + stClass; cs.textContent = stTxtS; }
  const pb = document.getElementById('cprog-' + id);
  if(pb) pb.style.width = pct + '%';
  const pp = document.getElementById('cpct-' + id);
  if(pp) pp.textContent = pct + '%';
  const mc = document.getElementById('cms-conf-' + id);
  const mn = document.getElementById('cms-nc-' + id);
  const mp = document.getElementById('cms-pend-' + id);
  if(mc) mc.textContent = '✓ ' + conf;
  if(mn) mn.textContent = '✗ ' + nc;
  if(mp) mp.textContent = '◎ ' + pend;

  // Drawer badge
  const db = document.getElementById('dbadge-' + id);
  if(db) {
    db.textContent = pend > 0 ? pend : nc > 0 ? '✗' : '✓';
    db.className = 'drawer-badge ' + (pend > 0 ? 'db-pend' : nc > 0 ? 'db-nc' : 'db-ok');
  }
}

function updateGlobal() {
  let totalConf=0, totalNC=0, totalPend=0;
  FVS_DATA.forEach(f => {
    const s = getStats(f.id);
    totalConf += s.conf; totalNC += s.nc; totalPend += s.pend;
  });
  document.getElementById('chip-ok').textContent = '✓ ' + totalConf;
  document.getElementById('chip-nc').textContent = '✗ ' + totalNC;
  document.getElementById('chip-pe').textContent = '◎ ' + totalPend;
  document.getElementById('ds-conf').textContent = totalConf;
  document.getElementById('ds-nc').textContent = totalNC;
  document.getElementById('ds-pend').textContent = totalPend;
}

function buildFvsHTMLForPrint(fvs) {
  const s = getStats(fvs.id);
  let itemIdx = 0;
  let groupsHTML = '';

  const panel = document.getElementById('panel-' + fvs.id);
  const fieldInputs = panel ? panel.querySelectorAll('.field-inp') : [];
  let fieldsHTML = '';
  fvs.fields.forEach((f, fi) => {
    const val = fieldInputs[fi] ? (fieldInputs[fi].value || fieldInputs[fi].placeholder || '') : '';
    fieldsHTML += `<div class="field"><div class="field-lbl">${f.l}</div><div class="field-val">${val}</div></div>`;
  });

  fvs.groups.forEach(grp => {
    let rows = '';
    grp.items.forEach(item => {
      const i = itemIdx++;
      const st = state[fvs.id][i];
      let chkCls='', chkChar='&nbsp;';
      if(st==='conf'){chkCls='chk-conf';chkChar='✓';}
      else if(st==='nc'){chkCls='chk-nc';chkChar='✗';}
      else if(st==='na'){chkCls='chk-na';chkChar='N/A';}
      rows += `<tr><td class="td-num">${i+1}</td><td><div class="item-text">${item.t}</div><div class="item-ref">${item.r}</div></td><td class="td-check"><div class="chk-box ${chkCls}">${chkChar}</div></td></tr>`;
    });
    groupsHTML += `<div class="grp-bar">${grp.g}</div><table class="items">${rows}</table>`;
  });

  const stCls = s.pend>0?'st-p':s.nc>0?'st-r':'st-a';
  const stTxt = s.pend>0?'Pendente':s.nc>0?'✗ Reprovado':'✓ Aprovado';
  const obsEl = panel ? panel.querySelector('.obs-inp') : null;
  const obsVal = obsEl && obsEl.value ? obsEl.value : '';
  const now = new Date();
  const ds = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const colorHex = {'var(--c1)':'#60A5FA','var(--c2)':'#34D399','var(--c3)':'#A78BFA','var(--c4)':'#FBBF24','var(--c5)':'#38BDF8','var(--c6)':'#F472B6','var(--c7)':'#FB923C'};
  const c = colorHex[fvs.color] || '#888';
  return `<div class="fvs-head"><div class="fvs-num" style="background:${c}">${fvs.num}</div><div><div class="fvs-title">${fvs.title}</div><div class="fvs-sub">${fvs.sub} · ${fvs.norma}</div></div></div>
    <div class="fields-grid">${fieldsHTML}</div>
    <div class="sec-bar">Itens de Verificação · C = Conforme · NC = Não Conforme · N/A = Não Aplicável</div>
    ${groupsHTML}
    <div class="result-row"><div class="result-cell"><div class="r-num" style="color:#1E7145">${s.conf}</div><div class="r-lbl">Conforme</div></div><div class="result-cell"><div class="r-num" style="color:#C00000">${s.nc}</div><div class="r-lbl">Não Conf.</div></div><div class="result-cell"><div class="r-num" style="color:#888">${s.na}</div><div class="r-lbl">N/A</div></div><div class="result-cell"><div class="r-num" style="color:#BF8F00">${s.pend}</div><div class="r-lbl">Pendentes</div></div><div class="result-cell"><div class="r-num" style="color:#333">${s.total}</div><div class="r-lbl">Total</div></div></div>
    <div class="status-row"><span class="st-lbl">Resultado</span><span class="st-val ${stCls}">${stTxt}</span></div>
    <div class="obs-wrap"><div class="obs-lbl">Observações / NCs</div><div class="obs-box">${obsVal}</div></div>
    <div class="assin-grid"><div class="assin-cell"><div class="assin-lbl">Estagiária</div><div class="assin-line"></div><div class="assin-sub">Nome / Data</div></div><div class="assin-cell"><div class="assin-lbl">Mestre de Obras</div><div class="assin-line"></div><div class="assin-sub">Nome / Data</div></div><div class="assin-cell"><div class="assin-lbl">Eng. Responsável</div><div class="assin-line"></div><div class="assin-sub">Nome / Data / CREA</div></div></div>
    <div class="emit">Residencial Manaii · ${ds} · Rev. 00</div>`;
}

function buildCoverHTMLForPrint() {
  const now = new Date();
  const ds = now.toLocaleDateString('pt-BR') + ' ' + now.toLocaleTimeString('pt-BR',{hour:'2-digit',minute:'2-digit'});
  const numMap = {hidraulica:'FVS-01',imper:'FVS-02',forro_gesso:'FVS-03',ceramico:'FVS-04',massa:'FVS-05',gesso:'FVS-06',eletrica:'FVS-07'};
  let rows = '';
  FVS_DATA.forEach(fvs => {
    const s = getStats(fvs.id);
    let res,cls;
    if(s.pend>0){res='Pendente';cls='pct-pend';}
    else if(s.nc>0){res='✗ Reprovado';cls='pct-fail';}
    else{res='✓ Aprovado';cls='pct-ok';}
    rows += `<tr><td><strong>${numMap[fvs.id]}</strong></td><td>${fvs.title}</td><td style="text-align:center">${s.total}</td><td style="text-align:center;color:#1E7145;font-weight:700">${s.conf}</td><td style="text-align:center;color:#C00000;font-weight:700">${s.nc}</td><td style="text-align:center;color:#666">${s.na}</td><td style="text-align:center;color:#BF8F00;font-weight:700">${s.pend}</td><td style="text-align:center" class="${cls}">${res}</td></tr>`;
  });
  return `<div class="cover"><h1>Residencial Manaii</h1><div class="sub">Relatório de Vistoria — FVS · Fase de Acabamentos</div><table><thead><tr><th>FVS</th><th>Serviço</th><th style="text-align:center">Total</th><th style="text-align:center">C</th><th style="text-align:center">NC</th><th style="text-align:center">N/A</th><th style="text-align:center">Pend.</th><th style="text-align:center">Resultado</th></tr></thead><tbody>${rows}</tbody></table><div class="emit-cover">Emitido em ${ds} · Rev. 00</div></div>`;
}

function gerarPDF(alvo) {
  let bodyHTML = alvo === 'todas'
    ? buildCoverHTMLForPrint() + FVS_DATA.map(f => `<div style="page-break-before:always">${buildFvsHTMLForPrint(f)}</div>`).join('')
    : buildFvsHTMLForPrint(FVS_DATA.find(f => f.id === alvo));

  const old = document.getElementById('print-container');
  if(old) old.remove();
  const oldS = document.getElementById('print-style');
  if(oldS) oldS.remove();

  const container = document.createElement('div');
  container.id = 'print-container';
  container.innerHTML = `<style>${PRINT_CSS}</style>` + bodyHTML;
  document.body.appendChild(container);

  const style = document.createElement('style');
  style.id = 'print-style';
  style.textContent = `@media print{@page{size:A4 portrait;margin:10mm 8mm;}html,body{visibility:hidden!important;background:white!important;}#print-container,#print-container *{visibility:visible!important;}#print-container{display:block!important;position:fixed!important;top:0!important;left:0!important;width:100%!important;background:white!important;z-index:999999!important;}*{-webkit-print-color-adjust:exact!important;print-color-adjust:exact!important;}}#print-container{display:none;}`;
  document.head.appendChild(style);

  setTimeout(() => {
    window.print();
    setTimeout(() => {
      const c = document.getElementById('print-container');
      const s = document.getElementById('print-style');
      if(c) c.remove(); if(s) s.remove();
    }, 2000);
  }, 250);
}
